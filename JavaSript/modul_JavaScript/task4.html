
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 4 - TodoList</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #taskList li { margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }

        /* Оформлення для кнопки "Додати" (синя) */
        #addBtn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
        }

        /* Оформлення для кнопки "Виконано" (зелена) */
        .done-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 4px 8px;
            cursor: pointer;
        }

        /* Оформлення для кнопки "Видалити" (червона) */
        .delete-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 4px 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h2>Список ToDo</h2>

<input id="taskInput" placeholder="Нове завдання">
<button id="addBtn">Додати</button>
<ul id="taskList"></ul>

<script src="task4.js"></script>
</body>
</html>
